name: Release

# Release flow (docs/code-standard/release-process.md). Every push to main runs `plan`:
#
# - changesets pending → `version` opens or updates the "Version Packages" PR
#   (`bun run version-packages`: lockstep bump of server + web, CHANGELOGs, root version, bun.lock);
# - no changesets, the root CHANGELOG has a section for the committed version, and that version has
#   no GitHub Release yet → `verify` checks, tests, builds the Docker image, smoke-tests it and
#   saves it as an artifact, then `publish` (environment `release`, optional reviewer approval)
#   pushes that exact image to GHCR, tags vX.Y.Z and creates the GitHub Release;
# - otherwise nothing.
#
# Merging the Version Packages PR is the release. A failed publish is retried by re-running the
# failed job: pushing the same tags again is idempotent and an existing Release is left alone.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select mode
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          mode=none
          if [ "$pending" -gt 0 ]; then
            mode=version
          elif grep -qF "## [$version]" CHANGELOG.md; then
            # Exit 0 = the Release exists; a 404 = not yet; anything else must not guess.
            if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
              :
            elif grep -q 'HTTP 404' <<< "$out"; then
              mode=publish
            else
              echo "::error::could not look up release v$version: $out"
              exit 1
            fi
          fi
          echo "$pending pending changesets, version $version → mode $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  version:
    name: Version Packages PR
    needs: plan
    if: needs.plan.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The PR is created with GITHUB_TOKEN, so CI does not run on it; `verify`
      # re-runs every check on the merged commit before anything is published.
      # Needs "Allow GitHub Actions to create and approve pull requests" in the repo settings.
      - name: Create or update the Version Packages PR
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: bun run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  verify:
    name: Verify release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Check lockstep versions
        run: |
          for manifest in package.json apps/server/package.json apps/web/package.json; do
            actual=$(jq -r .version "$manifest")
            if [ "$actual" != "$VERSION" ]; then
              echo "::error file=$manifest::version $actual, expected $VERSION"
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: bunx vp check

      - name: Tests
        run: bunx vp run -r test

      - name: Extract release notes
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release/notes.md"; then
            echo "::error file=CHANGELOG.md::no section for [$VERSION]"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # linux/amd64 only. The image builds the admin UI itself, so this also proves the web build.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: pp-ai-router:release
          labels: |
            org.opencontainers.image.title=pp-ai-router
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test image
        run: scripts/smoke-docker.sh pp-ai-router:release

      - name: Save image
        run: docker save pp-ai-router:release | gzip > "$RUNNER_TEMP/release/image.tar.gz"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment (Settings → Environments) for a human gate before GHCR.
    environment: release
    permissions:
      contents: write # tag + GitHub Release
      packages: write # push to GHCR
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # No checkout: this job only handles the verified artifact.
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Stable releases get X.Y.Z, X.Y and latest; a prerelease (X.Y.Z-rc.1) only its exact tag.
      - name: Push image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          gunzip -c "$RUNNER_TEMP/release/image.tar.gz" | docker load
          tags=("$VERSION")
          case "$VERSION" in
            *-*) ;;
            *) tags+=("${VERSION%.*}" latest) ;;
          esac
          for tag in "${tags[@]}"; do
            docker tag pp-ai-router:release "$image:$tag"
            docker push "$image:$tag"
          done

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "${prerelease[@]}"
