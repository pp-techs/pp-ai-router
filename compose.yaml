# Single-container deployment. Create .env next to this file with MASTER_KEY and ADMIN_TOKEN
# (MASTER_KEY: `openssl rand -base64 32`; keep it, it decrypts every stored upstream secret).
services:
  router:
    build: .
    image: pp-ai-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - router-data:/data
volumes:
  router-data:
